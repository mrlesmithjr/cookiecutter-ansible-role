[project]
name = "{{cookiecutter.role_slug}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
authors = [{ name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "ansible-core>=2.16",
  "ansible-lint>=25.0",
  "molecule>=26.0",
  "molecule-plugins[docker]>=23.0",
  "pre-commit>=4.0",
  "ruff>=0.4",
]

[tool.uv]
dev-dependencies = [
  "ansible-core>=2.16",
  "ansible-lint>=25.0",
  "molecule>=26.0",
  "molecule-plugins[docker]>=23.0",
  "pre-commit>=4.0",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 120
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

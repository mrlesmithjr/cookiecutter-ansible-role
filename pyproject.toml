[project]
name = "cookiecutter-ansible-role"
version = "0.1.0"
description = "Cookiecutter template for generating Ansible roles"
authors = [{ name = "Larry Smith Jr.", email = "mrlesmithjr@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "cookiecutter>=2.6",
]

[project.optional-dependencies]
dev = [
  "ansible-lint>=25.0",
  "molecule>=26.0",
  "pre-commit>=4.0",
]

[tool.uv]
dev-dependencies = [
  "ansible-lint>=25.0",
  "molecule>=26.0",
  "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
